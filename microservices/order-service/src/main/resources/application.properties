# Nom du service et port d'écoute
spring.application.name=order-service
server.port=8083

# Configuration de la base de données en mémoire
spring.datasource.url=jdbc:h2:mem:orderdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Création automatique des tables au lancement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Activation de la console web H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# URLs des autres microservices
catalogue.service.url=http://localhost:8081/api/products
customer.service.url=http://localhost:8082/api/customers