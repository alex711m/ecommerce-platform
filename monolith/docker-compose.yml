version: '3.8'

services:
  monolith-service:
    build: .
    ports:
      - "8080:8080"
    networks:
      - ecom-network

  frontend:
    build: ../frontend/ecommerce
    ports:
      - "80:80"
    volumes:
      - ../frontend/ecommerce/nginx.monolith.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - monolith-service
    networks:
      - ecom-network

networks:
  ecom-network:
    driver: bridge
