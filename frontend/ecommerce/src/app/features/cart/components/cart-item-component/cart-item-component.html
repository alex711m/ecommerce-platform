<div class="cart-item">

  <div class="cart-item__img-wrap">
    <img class="cart-item__img" [src]="item.imageUrl" [alt]="item.name" />
  </div>

  <div class="cart-item__info">
    <p class="cart-item__name">{{ item.name }}</p>
    <p class="cart-item__price">${{ item.price.toFixed(2) }}</p>

    <!-- Stepper quantité -->
    <div class="cart-item__stepper">
      <button class="stepper__btn" (click)="cartService.updateQuantity(item.id, item.quantity - 1)" aria-label="Diminuer">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
          stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <span class="stepper__value">{{ item.quantity }}</span>
      <button class="stepper__btn" (click)="cartService.updateQuantity(item.id, item.quantity + 1)" aria-label="Augmenter">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
          stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>

  <div class="cart-item__right">
    <span class="cart-item__subtotal">${{ (item.price * item.quantity).toFixed(2) }}</span>
    <button class="cart-item__remove" (click)="cartService.removeFromCart(item.id)" aria-label="Retirer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>

</div>
